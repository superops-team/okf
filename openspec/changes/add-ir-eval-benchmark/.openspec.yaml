id: add-ir-eval-benchmark
name: IR Evaluation Benchmark
description: Add information-retrieval quality metrics (Recall@K, Precision@K, MRR, NDCG@K) and a golden query benchmark set to quantify okf search quality, with a reproducible eval command and baseline scores.
author: okf-team
version: 1.3.0
status: proposed
created_at: "2026-09-01"
updated_at: "2026-09-01"
related_changes:
  - add-document-format-import
  - improve-indexing-correctness
specs:
  - specs/ir-eval-benchmark/spec.md
requires:
  - okf >= 1.3.0
  - go >= 1.26.0
impacts:
  - pkg/eval: new package for IR metrics (Recall@K/Precision@K/MRR/NDCG@K) and benchmark runner
  - pkg/eval/testdata/golden_queries.json: golden query set (20 cases over 7 document formats)
  - tools/eval.sh: one-command reproducible eval entrypoint
  - tests: pkg/eval unit tests (metrics boundaries) + end-to-end benchmark test
  - docs: README eval section + docs/knowledge/releases.md v1.3.0
