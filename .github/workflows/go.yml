# Go assurance pipeline: the single gauntlet entry point runs every layer
# (build / vet / gofmt / staticcheck / tests -race / coverage threshold /
# shuffle / mutation / real execution) and fails on the first broken one.
# See tools/gauntlet.sh.
name: Go
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'  # project go.mod requires go 1.26 (downmark v0.10.0)
    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    - name: Fetch embedded ONNX resources (ubuntu = linux/amd64)
      # 内嵌资源（ORT 动态库 + MiniLM 模型）被 .gitignore 排除，CI 干净 clone
      # 后必须先在构建期下载，否则 go:embed 会报 "no matching files found"。
      run: |
        ./scripts/fetch-ort.sh linux amd64
        ./scripts/fetch-model.sh amd64
    - name: Run gauntlet
      run: bash tools/gauntlet.sh
