<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKF Dashboard</title>
<!-- ECharts for force-directed graph rendering -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<!-- Alpine.js for reactive UI state -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.0/dist/cdn.min.js"></script>
<style>
/* ============================================================
   OKF Dashboard — Stylesheet
   Organization:
     1. CSS Variables (theme tokens)
     2. Reset & base
     3. Layout (header / main / sidebar)
     4. Header bar
     5. Graph canvas
     6. Detail panel
     7. Search & filter components
     8. Utility classes
     9. Responsive breakpoints
   ============================================================ */

/* --- 1. CSS Variables --- */
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #1a1d27;
  --bg-tertiary: #242836;
  --bg-hover: #2d3245;
  --border: #333849;
  --border-light: #3d4359;
  --text-primary: #e4e6ed;
  --text-secondary: #9ca3b8;
  --text-muted: #6b7280;
  --accent: #6c8cff;
  --accent-hover: #8aa4ff;
  --accent-glow: rgba(108, 140, 255, 0.15);
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #f87171;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --transition: 0.15s ease;
}

/* --- 2. Reset & base --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* --- 3. Layout --- */
.app { display: flex; flex-direction: column; height: 100vh; }
.main { display: flex; flex: 1; overflow: hidden; }
.graph-area { flex: 1; position: relative; min-width: 0; }
.sidebar {
  width: 380px;
  min-width: 380px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- 4. Header bar --- */
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.header-title .dot {
  width: 8px; height: 8px;
  background: var(--success);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--success);
}
.header-stats {
  display: flex;
  gap: 16px;
  margin-left: auto;
  flex-shrink: 0;
}
.stat {
  text-align: center;
  min-width: 60px;
}
.stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* --- 5. Graph canvas --- */
#graph { width: 100%; height: 100%; }
.graph-overlay {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.graph-loading {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: var(--text-secondary);
  font-size: 16px;
  z-index: 5;
}
.legend {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  box-shadow: var(--shadow-md);
}
.legend-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  padding: 2px 0;
  cursor: pointer;
  transition: color var(--transition);
}
.legend-item:hover { color: var(--text-primary); }
.legend-color {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* --- 6. Detail panel --- */
.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  word-break: break-word;
}
.panel-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
.panel-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  text-align: center;
  gap: 12px;
}
.panel-empty-icon {
  width: 48px; height: 48px;
  border: 2px dashed var(--border-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--text-muted);
}
.section { margin-bottom: 20px; }
.section-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.section-content { color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-block;
  padding: 2px 10px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
}
.tag:hover {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent-hover);
}
.type-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.code-block {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-secondary);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
}
.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.meta-item {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
}
.meta-key {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.meta-value {
  font-size: 12px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  word-break: break-all;
}

/* --- 7. Search & filter --- */
.search-box {
  position: relative;
  flex: 1;
  max-width: 400px;
}
.search-input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  pointer-events: none;
}
.filter-select {
  padding: 8px 12px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  cursor: pointer;
  transition: border-color var(--transition);
}
.filter-select:focus { border-color: var(--accent); }
.filter-select option { background: var(--bg-tertiary); color: var(--text-primary); }

/* --- 8. Utility --- */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt-8 { margin-top: 8px; }
.mb-8 { margin-bottom: 8px; }

/* --- 9. Responsive --- */
@media (max-width: 900px) {
  .sidebar { width: 300px; min-width: 300px; }
  .header-stats { display: none; }
}
@media (max-width: 700px) {
  .main { flex-direction: column; }
  .graph-area { height: 50vh; }
  .sidebar { width: 100%; min-width: 0; height: 50vh; border-left: none; border-top: 1px solid var(--border); }
  .header { flex-wrap: wrap; }
  .search-box { max-width: 100%; order: 3; width: 100%; }
}
</style>
</head>
<body>
<div class="app" x-data="dashboardApp()" x-init="init()">
  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <span class="dot"></span>
      OKF Knowledge Graph
    </div>
    <div class="search-box">
      <span class="search-icon">&#128269;</span>
      <input type="text" class="search-input" placeholder="Search concepts..."
             x-model="searchQuery" @input.debounce.300ms="onSearch()" />
    </div>
    <select class="filter-select" x-model="typeFilter" @change="onFilterChange()">
      <option value="">All Types</option>
      <template x-for="t in typeList" :key="t">
        <option :value="t" x-text="t"></option>
      </template>
    </select>
    <div class="header-stats">
      <div class="stat">
        <div class="stat-value" x-text="stats.totalConcepts || 0"></div>
        <div class="stat-label">Concepts</div>
      </div>
      <div class="stat">
        <div class="stat-value" x-text="stats.totalEdges || 0"></div>
        <div class="stat-label">Edges</div>
      </div>
      <div class="stat">
        <div class="stat-value" x-text="Object.keys(stats.types || {}).length"></div>
        <div class="stat-label">Types</div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <div class="main">
    <!-- Graph area -->
    <div class="graph-area">
      <div id="graph" x-show="!loading && !error"></div>
      <div class="graph-loading" x-show="loading">Loading knowledge graph...</div>
      <div class="graph-loading" x-show="error && !loading" x-text="error" style="color: var(--danger);"></div>
      <div class="graph-overlay" x-show="!loading && !error">
        <div class="legend">
          <div class="legend-title">Edge Types</div>
          <div class="legend-item"><span class="legend-color" style="background: #6c8cff;"></span> Parent</div>
          <div class="legend-item"><span class="legend-color" style="background: #4ade80;"></span> Shared Tag</div>
          <div class="legend-item"><span class="legend-color" style="background: #fbbf24;"></span> Same Folder</div>
        </div>
      </div>
    </div>

    <!-- Detail sidebar -->
    <aside class="sidebar">
      <template x-if="selectedNode">
        <div style="display: flex; flex-direction: column; height: 100%;">
          <div class="panel-header">
            <div class="panel-title" x-text="selectedNode.title"></div>
            <div class="panel-subtitle">
              <span class="type-badge" :style="typeBadgeStyle(selectedNode.type)" x-text="selectedNode.type"></span>
              <span x-text="selectedNode.filePath"></span>
            </div>
          </div>
          <div class="panel-body">
            <div class="section" x-show="selectedNode.description">
              <div class="section-title">Description</div>
              <div class="section-content" x-text="selectedNode.description"></div>
            </div>
            <div class="section" x-show="selectedNode.tags && selectedNode.tags.length">
              <div class="section-title">Tags</div>
              <div class="tag-list">
                <template x-for="tag in selectedNode.tags" :key="tag">
                  <span class="tag" x-text="tag" @click="searchQuery = tag; onSearch()"></span>
                </template>
              </div>
            </div>
            <div class="section" x-show="selectedNode.folder">
              <div class="section-title">Location</div>
              <div class="section-content" style="font-family: var(--font-mono); font-size: 12px;" x-text="selectedNode.folder"></div>
            </div>
            <div class="section" x-show="selectedNode.okfId || selectedNode.parentOkfId">
              <div class="section-title">Identity</div>
              <div class="meta-grid">
                <div class="meta-item" x-show="selectedNode.okfId">
                  <div class="meta-key">OKF ID</div>
                  <div class="meta-value" x-text="selectedNode.okfId"></div>
                </div>
                <div class="meta-item" x-show="selectedNode.parentOkfId">
                  <div class="meta-key">Parent ID</div>
                  <div class="meta-value" x-text="selectedNode.parentOkfId"></div>
                </div>
              </div>
            </div>
            <div class="section" x-show="detailContent">
              <div class="section-title">Content</div>
              <div class="code-block" x-text="detailContent"></div>
            </div>
            <div class="section" x-show="detailCustomFields && Object.keys(detailCustomFields).length">
              <div class="section-title">Custom Fields</div>
              <div class="meta-grid">
                <template x-for="(val, key) in detailCustomFields" :key="key">
                  <div class="meta-item">
                    <div class="meta-key" x-text="key"></div>
                    <div class="meta-value" x-text="val"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
      <template x-if="!selectedNode && !loading && !error">
        <div class="panel-empty">
          <div class="panel-empty-icon">&#128196;</div>
          <div>
            <div style="font-weight: 600; margin-bottom: 4px;">No concept selected</div>
            <div style="font-size: 12px;">Click a node in the graph to view its details</div>
          </div>
        </div>
      </template>
    </aside>
  </div>
</div>

<script>
/* ============================================================
   OKF Dashboard — Application Logic
   Modules:
     APIClient    - REST API communication
     GraphRenderer - ECharts graph initialization & updates
     dashboardApp - Alpine.js component (state + orchestration)
   ============================================================ */

(function() {
'use strict';

// --- APIClient ---
const APIClient = {
  async getGraph() {
    const res = await fetch('/api/v1/graph');
    if (!res.ok) throw new Error(`Failed to load graph: ${res.status}`);
    return res.json();
  },
  async getConcept(id) {
    const res = await fetch('/api/v1/concepts/' + encodeURIComponent(id));
    if (!res.ok) {
      if (res.status === 404) return null;
      throw new Error(`Failed to load concept: ${res.status}`);
    }
    return res.json();
  },
  async search(q, type, tag) {
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (type) params.set('type', type);
    if (tag) params.set('tag', tag);
    const res = await fetch('/api/v1/search?' + params.toString());
    if (!res.ok) throw new Error(`Search failed: ${res.status}`);
    return res.json();
  }
};

// --- Color palette for concept types ---
const TYPE_COLORS = [
  '#6c8cff', '#4ade80', '#fbbf24', '#f87171', '#a78bfa',
  '#22d3ee', '#fb923c', '#f472b6', '#34d399', '#facc15',
  '#818cf8', '#2dd4bf', '#e879f9', '#fb7185', '#94a3b8'
];
const typeColorMap = {};
let typeColorIndex = 0;

function getTypeColor(type) {
  if (!typeColorMap[type]) {
    typeColorMap[type] = TYPE_COLORS[typeColorIndex % TYPE_COLORS.length];
    typeColorIndex++;
  }
  return typeColorMap[type];
}

const EDGE_COLORS = {
  parent: '#6c8cff',
  tag: '#4ade80',
  folder: '#fbbf24'
};

// --- GraphRenderer ---
const GraphRenderer = {
  chart: null,
  dom: null,

  init(domId) {
    this.dom = document.getElementById(domId);
    this.chart = echarts.init(this.dom, 'dark', { renderer: 'canvas' });
    window.addEventListener('resize', () => this.chart.resize());
    return this;
  },

  render(graphData, onNodeClick) {
    const categories = Object.keys(graphData.stats.types || {}).map(t => ({
      name: t,
      itemStyle: { color: getTypeColor(t) }
    }));

    const nodes = graphData.nodes.map(n => ({
      id: n.id,
      name: n.title,
      category: n.type,
      symbolSize: Math.max(12, Math.min(40, n.size)),
      value: n.tags ? n.tags.length : 0,
      itemStyle: { color: getTypeColor(n.type) },
      label: {
        show: graphData.nodes.length < 80,
        fontSize: 11,
        color: '#e4e6ed',
        formatter: n.title.length > 20 ? n.title.substring(0, 18) + '…' : n.title
      },
      _data: n
    }));

    const edges = graphData.edges.map(e => ({
      source: e.source,
      target: e.target,
      lineStyle: {
        color: EDGE_COLORS[e.kind] || '#6b7280',
        width: e.kind === 'parent' ? 2 : 1,
        curveness: e.kind === 'tag' ? 0.2 : 0.1,
        opacity: 0.6
      }
    }));

    const option = {
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: function(params) {
          if (params.dataType === 'node') {
            const d = params.data._data;
            let html = `<b>${d.title}</b><br/>Type: ${d.type}`;
            if (d.tags && d.tags.length) html += `<br/>Tags: ${d.tags.join(', ')}`;
            if (d.folder) html += `<br/>Folder: ${d.folder}`;
            return html;
          }
          return '';
        },
        backgroundColor: 'rgba(26,29,39,0.95)',
        borderColor: '#3d4359',
        textStyle: { color: '#e4e6ed', fontSize: 12 }
      },
      legend: [{ show: false }],
      series: [{
        type: 'graph',
        layout: 'force',
        roam: true,
        draggable: true,
        focusNodeAdjacency: true,
        categories: categories,
        data: nodes,
        links: edges,
        force: {
          repulsion: Math.max(100, Math.min(800, graphData.nodes.length * 8)),
          edgeLength: [60, 150],
          gravity: 0.1,
          friction: 0.6
        },
        emphasis: {
          focus: 'adjacency',
          lineStyle: { width: 3 },
          itemStyle: { shadowBlur: 20, shadowColor: 'rgba(108,140,255,0.5)' }
        },
        select: {
          itemStyle: { borderColor: '#fff', borderWidth: 2 }
        },
        selectedMode: 'single'
      }]
    };

    this.chart.setOption(option, true);
    this.chart.off('click');
    this.chart.on('click', function(params) {
      if (params.dataType === 'node' && params.data._data) {
        onNodeClick(params.data._data);
      }
    });
  },

  highlightNodes(ids) {
    if (!this.chart) return;
    this.chart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
    if (ids && ids.length) {
      this.chart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: ids });
    }
  },

  resize() {
    if (this.chart) this.chart.resize();
  }
};

// --- Alpine.js Component ---
window.dashboardApp = function() {
  return {
    loading: true,
    error: null,
    graphData: null,
    stats: {},
    typeList: [],
    searchQuery: '',
    typeFilter: '',
    selectedNode: null,
    detailContent: '',
    detailCustomFields: {},
    searchTimeout: null,

    async init() {
      GraphRenderer.init('graph');
      try {
        this.graphData = await APIClient.getGraph();
        this.stats = this.graphData.stats || {};
        this.typeList = Object.keys(this.stats.types || {}).sort();
        GraphRenderer.render(this.graphData, (node) => this.onNodeClick(node));
        this.loading = false;
      } catch (err) {
        this.error = err.message;
        this.loading = false;
      }
    },

    async onNodeClick(node) {
      this.selectedNode = node;
      this.detailContent = '';
      this.detailCustomFields = {};
      try {
        const detail = await APIClient.getConcept(node.id);
        if (detail) {
          this.detailContent = detail.content || '';
          this.detailCustomFields = detail.customFields || {};
        }
      } catch (err) {
        console.warn('Failed to load concept detail:', err);
      }
    },

    async onSearch() {
      if (!this.searchQuery && !this.typeFilter) {
        GraphRenderer.highlightNodes([]);
        return;
      }
      try {
        const result = await APIClient.search(this.searchQuery, this.typeFilter, '');
        const ids = result.results.map(r => r.id);
        // Map IDs to data indices for ECharts highlight
        if (this.graphData) {
          const indices = [];
          this.graphData.nodes.forEach((n, i) => {
            if (ids.includes(n.id)) indices.push(i);
          });
          GraphRenderer.highlightNodes(indices);
        }
      } catch (err) {
        console.warn('Search failed:', err);
      }
    },

    onFilterChange() {
      this.onSearch();
    },

    typeBadgeStyle(type) {
      const color = getTypeColor(type);
      return `background: ${color}22; color: ${color}; border: 1px solid ${color}44;`;
    }
  };
};

})();
</script>
</body>
</html>
